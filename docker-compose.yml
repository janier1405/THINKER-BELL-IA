# NO EJECUTADO en esta sesión (sin Docker). Solo db + api; el frontend se sirve con `npm run dev` / build estático.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: thinkerbell, POSTGRES_DB: thinkerbell, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}" }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U thinkerbell"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://thinkerbell:${POSTGRES_PASSWORD}@db:5432/thinkerbell"
      JWT_SECRET: "${JWT_SECRET:?define JWT_SECRET}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_ENV: "${APP_ENV:-development}"
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck: { test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 5 }
volumes: { pgdata: {} }
